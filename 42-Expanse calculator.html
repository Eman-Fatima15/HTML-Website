<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #dbeafe);
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #172554;
            margin-bottom: 8px;
        }

        .header p {
            color: #64748b;
            font-size: 14px;
        }

        .form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        input,
        select {
            width: 100%;
            padding: 14px;
            border: 1px solid #dbe3ef;
            border-radius: 10px;
            outline: none;
            background: #f8fafc;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
            background: white;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .total {
            margin-top: 25px;
            padding: 20px;
            background: #eff6ff;
            border-radius: 12px;
            text-align: center;
        }

        .total span {
            display: block;
            color: #64748b;
            margin-bottom: 5px;
        }

        .total strong {
            color: #2563eb;
            font-size: 28px;
        }

        #expenses {
            margin-top: 25px;
        }

        .expense {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            margin-bottom: 10px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
        }

        .expense-info h3 {
            color: #172554;
            margin-bottom: 5px;
        }

        .expense-info p {
            color: #64748b;
            font-size: 13px;
        }

        .expense-amount {
            color: #dc2626;
            font-weight: bold;
        }

        .delete-btn {
            width: auto;
            margin: 8px 0 0 10px;
            padding: 7px 10px;
            background: #dc2626;
            font-size: 12px;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .error {
            margin-top: 20px;
            padding: 15px;
            text-align: center;
            color: #dc2626;
            background: #fef2f2;
            border-radius: 10px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px 18px;
            }

            .form {
                grid-template-columns: 1fr;
            }

            .expense {
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="header">
            <h1>Expense Calculator</h1>
            <p>Track and calculate your daily expenses</p>
        </div>

        <div class="form">
            <input type="text" id="expenseName" placeholder="Expense Name">

            <input type="number" id="expenseAmount" placeholder="Amount">

            <select id="category">
                <option value="">Select Category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Shopping">Shopping</option>
                <option value="Education">Education</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <button onclick="addExpense()">Add Expense</button>

        <div class="total">
            <span>Total Expenses</span>
            <strong>Rs. <span id="total">0</span></strong>
        </div>

        <div id="expenses"></div>

        <div id="error"></div>

    </div>

    <script>
        let expenses = [];

        function addExpense() {
            try {
                let name = document.getElementById("expenseName").value.trim();
                let amount = Number(document.getElementById("expenseAmount").value);
                let category = document.getElementById("category").value;

                if (name === "") {
                    throw new Error("Please enter expense name.");
                }

                if (amount <= 0) {
                    throw new Error("Please enter a valid amount.");
                }

                if (category === "") {
                    throw new Error("Please select a category.");
                }

                let expense = {
                    name: name,
                    amount: amount,
                    category: category
                };

                expenses.push(expense);

                document.getElementById("expenseName").value = "";
                document.getElementById("expenseAmount").value = "";
                document.getElementById("category").value = "";

                showExpenses();

            } catch (error) {
                document.getElementById("error").innerHTML =
                    '<div class="error">' + error.message + '</div>';
            }
        }

        function showExpenses() {
            let output = "";

            expenses.forEach((expense, index) => {
                output +=
                    '<div class="expense">' +
                    '<div class="expense-info">' +
                    '<h3>' + expense.name + '</h3>' +
                    '<p>' + expense.category + '</p>' +
                    '<button class="delete-btn" onclick="deleteExpense(' +
                    index + ')">Delete</button>' +
                    '</div>' +
                    '<div class="expense-amount">' +
                    'Rs. ' + expense.amount +
                    '</div>' +
                    '</div>';
            });

            document.getElementById("expenses").innerHTML = output;

            calculateTotal();
        }

        function calculateTotal() {
            let total = expenses.reduce(
                (sum, expense) => sum + expense.amount,
                0
            );

            document.getElementById("total").textContent = total;
        }

        function deleteExpense(index) {
            expenses.splice(index, 1);
            showExpenses();
        }
    </script>

</body>
</html>
