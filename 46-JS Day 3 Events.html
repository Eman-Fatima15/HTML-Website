<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 3 - JavaScript Events</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            text-align: center;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        .box {
            background: lightblue;
            padding: 30px;
            margin: 20px 0;
            border-radius: 10px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        input, select {
            padding: 10px;
            margin: 10px;
            width: 80%;
        }

        p {
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>JavaScript Events</h1>

        <h2>1. Click Event</h2>

        <button id="clickBtn">Click Me</button>
        <p id="clickOutput">Click the button</p>


        <h2>2. Mouseover Event</h2>

        <div class="box" id="mouseBox">
            Move Your Mouse Here
        </div>

        <p id="mouseOutput">Move your mouse over the box</p>


        <h2>3. Input Event</h2>

        <input type="text" id="nameInput" placeholder="Enter your name">

        <p id="inputOutput">Your name will appear here</p>


        <h2>4. Change Event</h2>

        <select id="citySelect">
            <option value="">Select City</option>
            <option value="Faisalabad">Faisalabad</option>
            <option value="Lahore">Lahore</option>
            <option value="Islamabad">Islamabad</option>
        </select>

        <p id="changeOutput">Your selected city will appear here</p>


        <h2>5. Keydown Event</h2>

        <input type="text" id="keyInput" placeholder="Press any key">

        <p id="keyOutput">Your pressed key will appear here</p>

    </div>


    <script>

        const clickBtn = document.getElementById("clickBtn");
        const clickOutput = document.getElementById("clickOutput");

        clickBtn.addEventListener("click", function() {
            clickOutput.textContent = "Button was clicked!";
        });


        const mouseBox = document.getElementById("mouseBox");
        const mouseOutput = document.getElementById("mouseOutput");

        mouseBox.addEventListener("mouseover", function() {
            mouseOutput.textContent = "Mouse is over the box!";
        });


        const nameInput = document.getElementById("nameInput");
        const inputOutput = document.getElementById("inputOutput");

        nameInput.addEventListener("input", function() {
            inputOutput.textContent = "Hello " + nameInput.value;
        });


        const citySelect = document.getElementById("citySelect");
        const changeOutput = document.getElementById("changeOutput");

        citySelect.addEventListener("change", function() {
            changeOutput.textContent = "You selected " + citySelect.value;
        });


        const keyInput = document.getElementById("keyInput");
        const keyOutput = document.getElementById("keyOutput");

        keyInput.addEventListener("keydown", function(event) {
            keyOutput.textContent = "You pressed: " + event.key;
        });

    </script>

</body>
</html>
