<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light & Dark Mode</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f5f9;
            color: #222;
            transition: 0.4s;
        }

        .container {
            width: 90%;
            max-width: 450px;
            background: white;
            padding: 40px 30px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: 0.4s;
        }

        .icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        h1 {
            margin-bottom: 12px;
        }

        p {
            line-height: 1.6;
            margin-bottom: 25px;
            color: #666;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
        }

        .dark {
            background: #101827;
            color: white;
        }

        .dark .container {
            background: #1e293b;
        }

        .dark p {
            color: #cbd5e1;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon" id="icon">☀️</div>

        <h1 id="title">Light Mode</h1>

        <p id="text">
            Welcome to my Day 2 JavaScript practice.
            Click the button to change the theme.
        </p>

        <button id="modeButton" onclick="changeMode()">
            🌙 Dark Mode
        </button>

    </div>

    <script>
        function changeMode() {

            document.body.classList.toggle("dark");

            let title = document.getElementById("title");
            let icon = document.getElementById("icon");
            let button = document.getElementById("modeButton");

            if (document.body.classList.contains("dark")) {

                title.textContent = "Dark Mode";
                icon.textContent = "🌙";
                button.textContent = "☀️ Light Mode";

            } else {

                title.textContent = "Light Mode";
                icon.textContent = "☀️";
                button.textContent = "🌙 Dark Mode";
            }
        }
    </script>

</body>
</html>
