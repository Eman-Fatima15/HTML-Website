<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 4 - Registration Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .form-container {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        .form-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-header h1 {
            color: #4f46e5;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .form-header p {
            color: #777;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            color: #333;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(102, 126, 234, 0.3);
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            font-weight: bold;
            color: #16a34a;
        }

        @media (max-width: 450px) {
            .form-container {
                width: 100%;
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="form-container">

        <div class="form-header">
            <h1>Registration Form</h1>
            <p>Please fill all required information</p>
        </div>

        <form id="registration Form">

            <div class="input-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name">
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email">
            </div>

            <div class="input-group">
                <label for="age">Age</label>
                <input type="number" id="age" placeholder="Enter your age">
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a password">
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your password">
            </div>

            <button type="submit">Register</button>

            <p id="message"></p>

        </form>
    </div>

    <script>
        let form = document.getElementById("registrationForm");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let age = document.getElementById("age").value;
            let password = document.getElementById("password").value;
            let confirmPassword = document.getElementById("confirmPassword").value;
            let message = document.getElementById("message");

            if (name === "") {
                message.textContent = "Please enter your name.";
            }
            else if (email === "") {
                message.textContent = "Please enter your email.";
            }
            else if (age === "") {
                message.textContent = "Please enter your age.";
            }
            else if (password === "") {
                message.textContent = "Please enter your password.";
            }
            else if (confirmPassword === "") {
                message.textContent = "Please confirm your password.";
            }
            else if (password !== confirmPassword) {
                message.textContent = "Passwords do not match.";
            }
            else {
                message.textContent = "Registration successful!";
            }
        });
    </script>

</body>
</html>
