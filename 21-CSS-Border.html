<!DOCTYPE html>
<html>
  <head>
    <title>CSS background-color</title>
    <style>
        body{
            background:linear-gradient(to right,#74ebd5, #ACB6E5);
        }
        h1{
            color:darkred;
            background-color: aqua;width: 300px;
            border: 3px solid black;
        }
        p{
            color:blue;
            background-color: rgb(193, 150, 234);width: 250px;
            border: 2px solid rgb(2, 2, 78);
        }
        input{
            border:2px solid rgb(29, 170, 29);
        }
    </style>
  </head>
  <body>
    <h1>Welcome to CSS</h1>
    <p>This is my first CSS program</p>
    <input type="text" placeholder="Enter Your Name">
  </body>
</html>
