<!DOCTYPE html>
<html lang="en"
<head>
     <meta charset="UTF-8">
     <meta name="viewport"
     content="width=device-width,initial-scale=1.0">
     <title>Student Registration Form</title>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
     <style>
        *{
             margin:0;
             padding:0;
             box-sizing:border-box;
             font-family:Arial, sans-serif;
        }

    body{
             background:rgb(192, 183, 226);
             padding:40px;
             background-image:url(background\ 3\ .jpg) ;
             background-size:cover ;
             background-repeat: no-repeat;
             background-position: 75%center;
        }

    .container{
             width:900px;
             margin:auto;
             background:rgb(238, 236, 240);
             border-radius:15px;
        }

    .header{
             display:flex;
             justify-content:space-between;
             align-items:center;
             padding:20px;
        }

    .left{
             width:100%;
        }

    .right{
              width:105%;
             text-align:right;
        }

    .left img{
              width:360px;
             margin-bottom:10px;
             margin-left: 10px;
        }

    .left h1{
             color:#004aad;
             font-size:35px;
             margin:10px ;
             margin-top: 1px;
        }

    .left p{
             color:rgb(113, 111, 111);
             margin-left: 10px;
        }

    .right img{
             width:100%;
             height:280px;
             object-fit: cover;
             border-radius: 20px 20px 120px;
        }

     form{
             padding:30px;
        }

         h2{
             color:#004aad;
             padding-left:3px;
        }

    .row{
             display:flex;
             gap:40px;
             margin-bottom:15px;
        }

    .input-box{
             flex:1;
        }

    .input-box label{
             display:block;
             margin-bottom:6px;
             font-weight:bold;
        }

    .input-box input,
    .input-box select,
     textarea{
             width:100%;
             padding:12px;
             border:1px solid #b3aeea;
             border-radius:8px;
        }

    .skills{
             display:flex;
             flex-wrap:wrap;
             gap:20px;
             margin:15px ;
        }

    .terms{
             margin-top:20px;
        }

    .buttons{
             display:flex;
             justify-content:center;
             gap:20px;
             margin-top:30px;
        }

    button{
             padding:12px 35px;
             border-radius:8px;
             cursor:pointer;
             font-size:16px;
        }

    button[type="submit"]{
             background:#2d108e;
             color:white;
        }

    button[type="reset"]{
             background:#ff4d4d;
             color:white;
        }

    button:hover{
             transform:scale(1.05);
             transition:.3s;
             background-color:green;
        }

    @media(max-width:500px){

    .container{
             width:150%;
        }
     label{
            margin-bottom: 5px;
            font-size: 14px;
        }
     input,select,textarea{
          margin-bottom: 12px;
          padding: 8px;
        }
     .form-group{
          margin-bottom: 10px;
     }
    .row{
             flex-direction:column;
        }

    .buttons{
             flex-direction:column;
        }

      }
        
     </style>
     </head>
    <body>
        <div class="container">
        <div class="header">
            <div class="left">
             <img src="image logo.png" alt="logo">
             <h1>Student Registration Form</h1>
             <p>Please fill all required information.</p>
        </div>
        <div class="right">
             <img src="image university.jpg" alt="building">
        </div>
        </div>
        <form>
             <h2 class="section-title"><i class="fa-solid fa-user"></i> Personal Information</h2><br>
             <div class="row">
             <div class="input-box">
             <label>First Name</label>
             <input type="text" placeholder="Enter First Name">
        </div>

       <div class="input-box">
             <label>Last Name</label>
             <input type="text" placeholder="Enter Last Name">
         
        </div>

        </div>

        <div class="row">
             <div class="input-box">
             <label>Father Name</label>
             <input type="text" placeholder="Enter Father Name">
        </div>

        <div class="input-box">
             <label>CNIC</label>
             <input type="text" placeholder="XXXXX-XXXXXXX-X">
        </div>

        </div>

        <div class="row">
             <div class="input-box">
             <label>Email</label>
             <input type="email" placeholder="Enter Email">
       </div>

        <div class="input-box">
             <label>Phone Number</label>
             <input type="tel" placeholder="03XX-XXXXXXX">
       </div>

       </div>

        <div class="row">
             <div class="input-box">
             <label>Date of Birth</label>
             <input type="date">
       </div>

        <div class="input-box">
              <label>Gender</label>

      <select>

              <option>Male</option>
              <option>Female</option>

      </select>

       </div>

       </div>

        <div class="input-box">
             <label>Address</label>
             <textarea rows="3" placeholder="Enter your full address"></textarea><br><br><br>
          
       </div>

             <h2 class="section-title"><i class="fa-solid fa-graduation-cap"></i> Academic Information</h2><br>

        <div class="row">
        <div class="input-box">
             <label>Department</label>
             <input type="text" placeholder="Select department"><br>

       </div>

        <div class="input-box">
             <label>Semester</label>

      <select>   

             <option>1st</option>
             <option>2nd</option>
             <option>3rd</option>
             <option>4th</option>

      </select>

      </div>

      </div>

        <div class="row">
             <div class="input-box">
             <label>Roll Number</label>
             <input type="text" placeholder="Enter roll number">

      </div>

        <div class="input-box">
             <label>Qualification</label>
             <input type="text" placeholder="Select quatification"><br><br>

      </div>

      </div>

             <h2 class="section-title"><i class="fa-solid fa-key"></i> Account Information</h2><br>

        <div class="row">
        <div class="input-box">
             <label>Username</label>
             <input type="text" placeholder="Choose Username">

      </div>

        <div class="input-box">
             <label>Password</label>
             <input type="password" placeholder="Create password">

      </div>

      </div>

        <div class="row">
        <div class="input-box">
             <label>Confirm Password</label>
             <input type="password" placeholder="Choose password">

      </div>

        <div class="input-box">
             <label>City</label>
             <input type="text" placeholder="Enter city"><br><br>

      </div>

      </div>

             <h2 class="section-title"><i class="fa-solid fa-upload"></i> Upload Documents</h2><br>
        <div class="row">
        <div class="input-box">
             <label>Profile Picture</label>
             <input type="file">

       </div>

        <div class="input-box">
             <label>Upload CV</label>
             <input type="file"><br><br>

       </div>

       </div>

             <h2 class="section-title"><i class="fa-solid fa-star"></i> Skills & Interests</h2><br>

        <div class="skills">

             <label><input type="checkbox"> HTML</label>
             <label><input type="checkbox"> CSS</label>
             <label><input type="checkbox"> JavaScript</label>
             <label><input type="checkbox"> Python</label><br><br>

        </div>

             <h2 class="section-title"><i class="fa-solid fa-comment"></i> Comments</h2><br>

            <textarea rows="5" placeholder="Enter any additional information..."></textarea>

       <div class="terms">
            <input type="checkbox" required>
            <label> I Agree to <a href="terms.html" target="_blank">Terms & Conditions</a></label>

     </div>
     <div class="buttons">
             <button type="submit">Submit</button>
             <button type="reset">Reset</button>

    </div>

    </form>
    </div>

     </body>
    </html>
        </form>

    </body>
