<!DOCTYPE html>
<html>

<head>

    <title>Responsive Website</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        body{
            background-color: lightblue;
            margin: 0;
            padding: 20px;
            background-image: url(background\ 3\ .jpg);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
        }
        
        .container{
            width: 600px;
            margin: auto;
            background-color: white;
            border: 2px solid black;
            padding: 20px;
            text-align:  center;
        }

        h1{
            color: darkblue;
        }

        p{
            font-size: 18px;
        }

        button{
            background-color: blue;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover{
            background-color: red;
        }

        /* Responsive Code */
        @media (max-width:600px){

            .container{
                width: 90%;
            }

            h1{
                font-size: 24px;
            }

            p{
                font-size: 16px;
            }

            button{
                width: 100%;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Registration form</h1>

        <p>Welcome to our University Student Registration Form.</p>

        <button>Register</button>

    </div>

</body>

</html>
