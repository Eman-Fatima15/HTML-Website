<!DOCTYPE html>
<html>
<head>
    <title>CSS Padding</title>

    <style>

        body{
            background-color: lightblue;
        }

        h1{
            background-color: yellow;
            border: 2px solid black;

            width: 350px;
            margin: 30px;      
            padding: 30px;    
        }

        p{
            background-color: white;
            border: 2px solid black;

            width: 350px;
            margin: 30px;      
            padding: 20px;     
        }

    </style>

</head>

<body>

    <h1>Welcome to CSS Padding</h1>
<p>This is my first CSS Padding example.</p>
</body>
</html>
