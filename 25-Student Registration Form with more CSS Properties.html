<!DOCTYPE html>
<html>
  <head>
    <title>Student Registration Form</title>
    <style>
        body{
            background-image: url(background.jpg);
            background-size: cover;
            background-position: center;
            margin-left:30px;
            border: 3px solid black;
            margin-right:30px;
            padding: 30px;
         }
        h1{
            background-color:lightskyblue;width: 450px;
            border:3px solid black;
            text-align: center;
            margin-left: auto;
            margin-right: auto;
            padding: 10px;
        }
        h2 label{
            text-align:left;
            color: rgb(27, 10, 53);
            font-size:28px;
        }
        input{
            border-radius:  20px ;
            border-color: rgb(14, 1, 47);
            height: 50px;
            font-size: 18px;
            padding: 10px;
        }
        label{
            font-size: 22px;
        }
        input[type="checkbox"]{
            width: 22px;
            height: 22px;
        }  
        input[type="radio"]{
            width: 20px;
            height:20px;

        }    
        button{
            color: rgb(216, 232, 216);
            background-color:rgb(2, 143, 49);
        }
    </style>
  </head>
  <body>
    <form>
    <h1 align="center">Student Registration Form</h1>
        <h2><label>Full Name:</label></h2>
        <input type="text" placeholder="Enter Your Name" style="width:250px;">
        <br>
        <h2><label>Age:</label></h2>
        <input type="number" placeholder="Enter Your Age" style="width:250px;">
        <br>
        <h2><label>Email:</label></h2>
        <input type="email" placeholder="Enter Your Email" style="width:250px;">
        <br>
        <h2><label>Password:</label></h2>
        <input type="password" placeholder="Enter Your Password" style="width:250px;">
        <br>
        <h2><label>Phone Number:</label></h2>
        <input type="Ph number" placeholder="Enter Your Phone Number" style="width:250px;">
        <br>
        <h2><label>Date Of Birth:</label></h2>
        <input type="date"><br>
        <h2><label>Gender:</label></h2>
        <input type="radio" name="gender"><label>Male</label>
        <input type="radio" name="gender"><label>Female</label>
        <br>
        <h2><label>Course:</label></h2>
        <input type="checkbox"> <label>BS AI</label><br><br>
        <input type="checkbox"><label>BS CS</label><br><br>
        <input type="checkbox"><label>BS SE</label><br>
        <h2><label>City:</label></h2>
        <select>
            <option>Lahore</option>
            <option>Islamabad</option>
            <option>Karachi</option>
        </select>
        <h2><label>Address:</label></h2>
        <textarea row="4" cols="35" placeholder="Enter Your Address"></textarea><br><br>
        <Button style="width:100px;height:35px;">Submit</Button>
        </form>
  </body>
</html>
