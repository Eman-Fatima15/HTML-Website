<!DOCTYPE html>
<html>
<head>
    <title>CSS Margin</title>

    <style>
        body{
            background-color: lightblue;
        }

        h1{
            background-color: white;
            border: 2px solid black;
            width: 400px;

            margin-left: auto;
            margin-right: auto;
            margin-top: 50px;
            margin-bottom: 30px;

            text-align: center;
        }

        p{
            background-color: yellow;
            border: 2px solid black;

            margin: 30px;
        }
    </style>
</head>

<body>

    <h1>Welcome to CSS Margin</h1>

    <p>
        This is my first Margin example.
    </p>

</body>
</html>
